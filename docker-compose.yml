version: "3.9"

services:
  llm-proxy:
    build: ../free-claude-code
    ports:
      - "8082:8082"
    env_file:
      - ../free-claude-code/.env
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - LLM_PROXY_URL=http://llm-proxy:8082
    depends_on:
      - llm-proxy
    volumes:
      - mether-data:/root/.mether
    restart: unless-stopped

  whatsapp:
    build: ./whatsapp
    ports:
      - "3001:3001"
    env_file:
      - ./whatsapp/.env
    volumes:
      - whatsapp-auth:/app/.wwebjs_auth
    restart: unless-stopped

volumes:
  mether-data:
  whatsapp-auth:
