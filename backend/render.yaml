services:
  - type: web
    name: mether-backend
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn src.mether.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROXY_URL
        value: https://mether-llm-proxy.onrender.com
      - key: LLM_MODEL
        fromGroup: mether-secrets
      - key: ANTHROPIC_AUTH_TOKEN
        fromGroup: mether-secrets
      - key: GOOGLE_CREDENTIALS_PATH
        value: /tmp/google_credentials.json
      - key: GOOGLE_TOKEN_PATH
        value: /tmp/google_token.json
      - key: CLAUDE_MD_PATH
        value: /tmp/CLAUDE.md
    healthCheckPath: /health
